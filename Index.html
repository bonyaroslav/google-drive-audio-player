<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Казки</title>
  <style>
    :root {
      --maxWidth: 880px;
      --radius: 18px;
      --radiusSoft: 14px;
      --border: #d7d2cb;
      --borderSoft: #ece6de;
      --text: #1f1a17;
      --textSoft: #6a625c;
      --bg: linear-gradient(180deg, #f7f1e8 0%, #fbf8f3 100%);
      --card: rgba(255, 252, 247, 0.94);
      --cardStrong: #fffaf2;
      --accent: #1f6b5f;
      --accentSoft: #dff1ec;
      --shadow: 0 10px 24px rgba(57, 44, 34, 0.08);
      --shadowSoft: 0 4px 10px rgba(57, 44, 34, 0.05);
      --touch: 48px;
      --h1: 28px;
      --h2: 18px;
      --meta: 13px;
    }
    * { box-sizing: border-box; }
    html { background: #f7f1e8; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .wrap {
      max-width: var(--maxWidth);
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom));
    }
    .topBar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .titleBlock h1 {
      margin: 0;
      font-size: var(--h1);
      line-height: 1.15;
    }
    .subtitle {
      margin-top: 6px;
      color: var(--textSoft);
      font-size: 14px;
      line-height: 1.4;
    }
    .langWrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      min-width: 82px;
    }
    .langWrap label,
    .meta,
    .buildInfo {
      color: var(--textSoft);
      font-size: var(--meta);
    }
    .langWrap select,
    .refreshBtn,
    button,
    a.btn {
      min-height: var(--touch);
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font: inherit;
      text-decoration: none;
      cursor: pointer;
      box-shadow: var(--shadowSoft);
    }
    .langWrap select {
      padding: 0 12px;
      width: 82px;
    }
    .hero,
    .player,
    .feedSection,
    .pager {
      border: 1px solid var(--borderSoft);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .hero {
      padding: 18px;
      margin-bottom: 14px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--accentSoft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .heroTitle {
      margin: 12px 0 8px;
      font-size: 22px;
      line-height: 1.25;
    }
    .heroMeta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--textSoft);
      font-size: 14px;
    }
    .heroActions,
    .controls,
    .cardActions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .bookGroup {
      display: grid;
      gap: 12px;
    }
    .bookHeading {
      margin: 4px 0 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    button,
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 600;
      user-select: none;
    }
    .btnPrimary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btnSoft {
      background: #fff;
    }
    button[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .player {
      padding: 16px;
      margin-bottom: 14px;
    }
    .player[hidden],
    .pager[hidden],
    .hero[hidden] { display: none; }
    .now {
      font-weight: 700;
      margin-bottom: 10px;
    }
    audio {
      width: 100%;
      min-height: 44px;
    }
    .statusRow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--borderSoft);
      color: var(--textSoft);
      background: #fff;
      font-size: 12px;
      font-weight: 600;
    }
    .feedSection { padding: 16px; }
    .sectionTop {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .sectionTop h2 {
      margin: 0;
      font-size: var(--h2);
    }
    .refreshBtn {
      padding: 0 14px;
      font-size: 14px;
      font-weight: 600;
      background: #fff;
    }
    .list {
      display: grid;
      gap: 12px;
    }
    .card {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: var(--radiusSoft);
      border: 1px solid var(--borderSoft);
      background: var(--cardStrong);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .card.active {
      border-color: #8bb8af;
      box-shadow: 0 0 0 3px rgba(31, 107, 95, 0.09);
    }
    .cardHeader {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .cardTitle {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
    }
    .cardDate {
      color: var(--textSoft);
      font-size: 13px;
      white-space: nowrap;
    }
    .cardBook {
      color: var(--textSoft);
      font-size: 14px;
      line-height: 1.4;
    }
    .cardPrimary { width: 100%; }
    .debug {
      margin-top: 12px;
      border: 1px dashed var(--border);
      border-radius: var(--radiusSoft);
      padding: 10px;
      background: #fff;
      display: none;
    }
    .debug pre {
      margin: 8px 0 0;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .pager {
      margin-top: 14px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pagerBtn {
      min-width: 46px;
      min-height: 46px;
      padding: 0 12px;
    }
    .pagerBtn.active {
      background: var(--accentSoft);
      border-color: #8bb8af;
    }
    .pageInfo {
      color: var(--textSoft);
      font-size: 14px;
      margin-left: 4px;
    }
    @media (max-width: 430px) {
      .wrap { padding-left: 12px; padding-right: 12px; }
      .topBar { align-items: stretch; }
      .langWrap { align-items: stretch; }
      .langWrap select { width: 100%; }
      .heroTitle { font-size: 20px; }
      .cardHeader { flex-direction: column; }
      .cardDate { white-space: normal; }
      .heroActions > *,
      .controls > *,
      .cardActions > * { flex: 1 1 auto; }
    }
  </style>
</head>

  <script>
    (function () {
      var logs = [];
      function push(msg) {
        try {
          var line = '[boot] ' + msg;
          logs.push(line);
          if (window.console && console.log) console.log(line);
        } catch (e) {}
      }
      window.__BOOT_LOGS = logs;
      window.__bootLog = push;
      window.addEventListener('error', function (ev) {
        var msg = ev && ev.message ? ev.message : 'unknown error';
        var src = ev && ev.filename ? ev.filename : 'no-file';
        var ln = ev && ev.lineno ? ev.lineno : 0;
        push('window.error: ' + msg + ' @ ' + src + ':' + ln);
      });
      window.addEventListener('unhandledrejection', function (ev) {
        var reason = ev && ev.reason ? String(ev.reason) : 'unknown rejection';
        push('unhandledrejection: ' + reason);
      });
      push('bootstrap loaded; build=<?= buildId ?>');
    })();
  </script>

    var CONFIG = {
      defaultLanguage: 'uk',
      rememberLanguage: true,
      itemsPerPage: 10,
      playbackMode: 'driveOnly',
      autoplayOnSelect: true,
      autoplayFirstItem: false,

    };
    var COOKIE_MAX_AGE_SECONDS = 31536000;

    function isDebugEnabled() {
      var q = String(window.location.search || '');
      return q.indexOf('debug=1') >= 0;
    }
    if (isDebugEnabled()) {
      CONFIG.debug = true;
      CONFIG.logToConsole = true;
    }

    function parseItemsFromDom() {
      if (window.__bootLog) window.__bootLog('parseItemsFromDom:start');
      try {
        var node = document.getElementById('itemsData');
        var raw = node ? node.textContent : '[]';
        if (window.__bootLog) window.__bootLog('itemsData chars=' + (raw ? raw.length : 0));
        var parsed = JSON.parse(raw || '[]');
        if (window.__bootLog) window.__bootLog('parseItemsFromDom:ok items=' + (parsed && parsed.length ? parsed.length : 0));
        return Object.prototype.toString.call(parsed) === '[object Array]' ? parsed : [];
      } catch (e) {
        console.error('Failed to parse itemsJson', e);
        if (window.__bootLog) window.__bootLog('parseItemsFromDom:error ' + (e && e.message ? e.message : String(e)));
        return [];
      }
    }

    var ITEMS = parseItemsFromDom();
    var state = { flat: [], currentIndex: -1, currentPage: 1, lang: 'uk' };

    function $(id) { return document.getElementById(id); }
    var audio = $('audio');

    function log() {
      var args = Array.prototype.slice.call(arguments);
      if (CONFIG.logToConsole && console && console.log) console.log.apply(console, ['[stories]'].concat(args));
      if (window.__BOOT_LOGS) {
        try {
          var compact = [];
          for (var i = 0; i < args.length; i++) compact.push(typeof args[i] === 'string' ? args[i] : JSON.stringify(args[i]));
          window.__BOOT_LOGS.push('[stories] ' + compact.join(' '));
        } catch (e) {}
      }
      if (CONFIG.debug) {
        var msg = [];
        for (var j = 0; j < args.length; j++) msg.push(typeof args[j] === 'string' ? args[j] : JSON.stringify(args[j], null, 2));
        debugOut.textContent = (debugOut.textContent + '\n' + msg.join(' ')).trim();
      }
    }

    function setStatus(text) { statusEl.textContent = text; }
    function t(key, vars) {
      var langPack = I18N[state.lang] || I18N[CONFIG.defaultLanguage] || I18N.uk;
      var fallback = I18N.uk || {};
      var raw = Object.prototype.hasOwnProperty.call(langPack, key) ? langPack[key] : fallback[key];
      var text = raw == null ? key : String(raw);
      if (!vars) return text;
      return text.replace(/\{([a-zA-Z0-9_]+)\}/g, function (_, name) {
        return Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : '';
      });
    }
    function normalizeLang(lang) {
      if (!lang) return CONFIG.defaultLanguage;
      return Object.prototype.hasOwnProperty.call(I18N, lang) ? lang : CONFIG.defaultLanguage;
    }
    function loadPreferredLang() {
      if (!CONFIG.rememberLanguage) return CONFIG.defaultLanguage;
      try {
        var cookieLang = readCookie('uiLang');
        if (cookieLang) return normalizeLang(cookieLang);
        return normalizeLang(localStorage.getItem('uiLang:v1'));
      } catch (e) {
        return CONFIG.defaultLanguage;
      }
    }
    function savePreferredLang(lang) {
      if (!CONFIG.rememberLanguage) return;
      writeCookie('uiLang', lang, COOKIE_MAX_AGE_SECONDS);
      try {
        localStorage.setItem('uiLang:v1', lang);
      } catch (e) {}
    }
    function readCookie(name) {
      var escaped = String(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var m = document.cookie.match(new RegExp('(?:^|; )' + escaped + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : '';
    }
    function writeCookie(name, value, maxAgeSeconds) {
      document.cookie = name + '=' + encodeURIComponent(value) + '; path=/; max-age=' + String(maxAgeSeconds) + '; SameSite=Lax';
    }
    function safeText(s) { return s == null ? '' : String(s); }
    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
    function getPageSize() {
      var n = Number(CONFIG.itemsPerPage);
      if (!isFinite(n) || n < 1) return 10;
      return Math.floor(n);
    }
    function getTotalPages() {
      var pageSize = getPageSize();
      return Math.max(1, Math.ceil(state.flat.length / pageSize));
    }
    function pageForIndex(index) { return Math.floor(index / getPageSize()) + 1; }
    function clampPage(page) { return clamp(page, 1, getTotalPages()); }
    function storageKeyForTrack(track) {
      return track && (track.id ? 'pos:' + track.id : 'pos:' + track.url);
    }
    function loadSavedPosition(track) {
      if (!CONFIG.rememberPosition) return 0;
      try {
        var raw = localStorage.getItem(storageKeyForTrack(track));
        var val = raw ? Number(raw) : 0;
        return isFinite(val) ? val : 0;
      } catch (e) {
        return 0;
      }
    }
    function savePosition(track, seconds) {
      if (!CONFIG.rememberPosition || !isFinite(seconds) || seconds < CONFIG.rememberPositionMinSeconds) return;
      try {
        localStorage.setItem(storageKeyForTrack(track), String(seconds));
      } catch (e) {}
    }
    function clearPosition(track) {
      if (!CONFIG.rememberPosition) return;
      try {
        localStorage.removeItem(storageKeyForTrack(track));
      } catch (e) {}
    }
    function getCompactDateFormatter(lang) {
      var locale = 'en-US';
      if (lang === 'uk') locale = 'uk-UA';
      else if (lang === 'ru') locale = 'ru-RU';
      return new Intl.DateTimeFormat(locale, {
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
    }
    function startOfLocalDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }
    function formatDisplayDate(createdMs) {
      if (!createdMs) return '';
      var dt = new Date(createdMs);
      var today = startOfLocalDay(new Date());
      var target = startOfLocalDay(dt);
      var days = Math.round((today - target) / 86400000);
      if (days === 0) return t('today');
      if (days === 1) return t('yesterday');
      if (days === 2) return t('dayBeforeYesterday');
      return getCompactDateFormatter(state.lang).format(dt);
    }
    function makeEl(tag, className, text) {
      var el = document.createElement(tag);
      if (className) el.className = className;
      if (text != null) el.textContent = text;
      return el;
    }
    function makeLink(text, href, opts) {
      opts = opts || {};
      var a = document.createElement('a');
      a.className = 'btn' + (opts.primary ? ' btnPrimary' : ' btnSoft');
      a.href = href || '#';
      a.textContent = text;
      if (opts.newTab) {
        a.target = '_blank';
        a.rel = 'noopener';
      }
      if (opts.onClick) a.addEventListener('click', opts.onClick);
      return a;
    }
    function isExperimentalAudioMode() {
      return CONFIG.playbackMode === 'experimentalHtmlAudio';
    }
    function updateNavButtons() {
      btnPrev.disabled = !(state.currentIndex > 0);
      btnNext.disabled = !(state.currentIndex >= 0 && state.currentIndex + 1 < state.flat.length);
    }
    function highlightActive() {
      var nodes = document.querySelectorAll('.card');
      for (var i = 0; i < nodes.length; i++) nodes[i].classList.remove('active');
      var el = document.querySelector('.card[data-idx="' + state.currentIndex + '"]');
      if (el) el.classList.add('active');
    }
    function applyStaticLabels() {
      document.documentElement.lang = state.lang;
      $('pageTitle').textContent = t('appTitle');
      document.title = t('appTitle');
      pageSubtitle.textContent = t('pageSubtitle');
      langLabelEl.textContent = t('langLabel');
      feedTitle.textContent = t('latestStories');
      refreshBtn.textContent = t('buttonRefresh');
      heroOpenDrive.textContent = t('openLatestLabel');
      now.textContent = t('nowNothingSelected');
      btnPrev.textContent = t('buttonPrev');
      btnPrev.title = t('buttonPrevTitle');
      btnNext.textContent = t('buttonNext');
      btnNext.title = t('buttonNextTitle');
      btnBack.textContent = t('buttonBack');
      btnBack.title = t('buttonBackTitle');
      btnFwd.textContent = t('buttonFwd');
      btnFwd.title = t('buttonFwdTitle');
      openDrive.textContent = t('continueInDriveLabel');
      debugTitle.textContent = t('debugTitle');
      debugHint.textContent = t('debugHint');
    }
    function setLanguage(lang, rerender) {
      state.lang = normalizeLang(lang);
      langSelect.value = state.lang;
      savePreferredLang(state.lang);
      applyStaticLabels();
      if (rerender) render(true);
    }
    function setHero(track) {
      if (!track) {
        hero.hidden = true;
        return;
      }
      hero.hidden = false;
      heroEyebrow.textContent = t('latestBadge');
      heroTitle.textContent = track.displayTitle;
      heroMeta.textContent = '';
      heroMeta.appendChild(makeEl('span', null, t('uploadedAt', { date: track.displayDate })));
      if (track.book) heroMeta.appendChild(makeEl('span', null, t('byBook', { book: track.book })));
      heroOpenDrive.href = track.viewUrl || '#';
    }
    function setAudioSource(url) {
      audio.pause();
      audio.removeAttribute('src');
      audio.src = url;
      audio.load();
    }
    function tryPlay() {
      try {
        var playPromise = audio.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise.then(function () {
            setStatus(t('statusPlaying'));
          }).catch(function (e) {
            setStatus(t('statusPressPlay'));
            log('play() blocked or failed', e && e.message ? e.message : e);
          });
        } else {
          setStatus(t('statusPlaying'));
        }
      } catch (e) {
        setStatus(t('statusPressPlay'));
        log('play() failed', e && e.message ? e.message : e);
      }
    }
    function setCurrent(index, autoplay) {
      if (typeof autoplay === 'undefined') autoplay = CONFIG.autoplayOnSelect;
      if (index < 0 || index >= state.flat.length) return;

      var targetPage = pageForIndex(index);
      if (targetPage !== state.currentPage) {
        state.currentPage = targetPage;
        renderPager();
        renderCurrentPage();
      }

      state.currentIndex = index;
      var track = state.flat[index];
      setHero(track);
      highlightActive();
      updateNavButtons();

      if (!isExperimentalAudioMode()) {
        setStatus(t('statusReady'));
        hint.textContent = t('openInDriveHint');
        return;
      }

      now.textContent = track.displayTitle;
      hint.textContent = t('uploadedAt', { date: track.displayDate });
      openDrive.href = track.viewUrl || '#';
      setStatus(t('statusLoading'));
      setAudioSource(track.url || '');

      var saved = loadSavedPosition(track);
      audio.onloadedmetadata = function () {
        if (saved > 0 && isFinite(audio.duration)) {
          audio.currentTime = clamp(saved, 0, Math.max(0, audio.duration - 0.5));
        }
        if (autoplay) tryPlay();
        highlightActive();
        updateNavButtons();
      };

      audio.onerror = function () {
        setStatus(t('statusError'));
        hint.textContent = t('playbackUnavailableHint');
        log('audio error', {
          code: audio.error ? audio.error.code : 'unknown',
          url: track.url,
          id: track.id
        });
      };
    }
    function next() {
      if (state.currentIndex + 1 < state.flat.length) setCurrent(state.currentIndex + 1, true);
    }
    function prev() {
      if (state.currentIndex - 1 >= 0) setCurrent(state.currentIndex - 1, true);
    }
    function getPageWindow(total, current, visibleCount) {
      var count = Math.max(1, visibleCount || 5);
      var start = Math.max(1, current - Math.floor(count / 2));
      var end = Math.min(total, start + count - 1);
      start = Math.max(1, end - count + 1);
      return { start: start, end: end };
    }
    function renderPagerInto(container, totalPages, currentPage) {
      container.textContent = '';
      container.hidden = totalPages <= 1;
      if (totalPages <= 1) return;

      var frag = document.createDocumentFragment();
      function addButton(label, targetPage, disabled, active) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pagerBtn' + (active ? ' active' : '');
        btn.textContent = label;
        btn.disabled = !!disabled;
        if (!disabled) {
          btn.addEventListener('click', function () {
            state.currentPage = clampPage(targetPage);
            renderPager();
            renderCurrentPage();
          });
        }
        frag.appendChild(btn);
      }

      addButton(t('pagerFirst'), 1, currentPage <= 1, false);
      addButton(t('pagerPrev'), currentPage - 1, currentPage <= 1, false);
      var windowPages = getPageWindow(totalPages, currentPage, 5);
      for (var p = windowPages.start; p <= windowPages.end; p++) {
        addButton(String(p), p, false, p === currentPage);
      }
      addButton(t('pagerNext'), currentPage + 1, currentPage >= totalPages, false);
      addButton(t('pagerLast'), totalPages, currentPage >= totalPages, false);
      frag.appendChild(makeEl('span', 'pageInfo', t('pagerInfo', { current: currentPage, total: totalPages })));
      container.appendChild(frag);
    }
    function renderPager() {
      var totalPages = getTotalPages();
      state.currentPage = clampPage(state.currentPage);
      renderPagerInto(pagerTop, totalPages, state.currentPage);
      renderPagerInto(pagerBottom, totalPages, state.currentPage);
    }
    function renderCurrentPage() {
      listEl.textContent = '';
      var pageSize = getPageSize();
      var startIdx = (state.currentPage - 1) * pageSize;
      var endIdx = Math.min(state.flat.length, startIdx + pageSize);
      var frag = document.createDocumentFragment();
      var currentGroup = null;
      var currentBook = '';

      for (var idx = startIdx; idx < endIdx; idx++) {
        var track = state.flat[idx];
        if (!currentGroup || currentBook !== track.book) {
          currentBook = track.book;
          currentGroup = makeEl('section', 'bookGroup');
          if (currentBook) currentGroup.appendChild(makeEl('h3', 'bookHeading', currentBook));
          frag.appendChild(currentGroup);
        }
        var card = makeEl('article', 'card');
        card.setAttribute('data-idx', String(idx));

        var header = makeEl('div', 'cardHeader');
        header.appendChild(makeEl('div', 'cardTitle', track.displayTitle));
        header.appendChild(makeEl('div', 'cardDate', track.displayDate));
        card.appendChild(header);

        if (track.book) card.appendChild(makeEl('div', 'cardBook', t('byBook', { book: track.book })));

        var actions = makeEl('div', 'cardActions');
        actions.appendChild(makeLink(t('openInDriveLabel'), track.viewUrl, { newTab: true, primary: true }));

        card.appendChild(actions);
        (function (capturedIdx) {
          card.addEventListener('click', function (e) {
            var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
            if (tag === 'a' || tag === 'button') return;
            setCurrent(capturedIdx, false);
          });
        })(idx);
        currentGroup.appendChild(card);
      }

      listEl.appendChild(frag);
      highlightActive();
    }
    function buildFlatTracks(items) {
      state.flat = [];
      var groupedOrder = [];
      var groupedMap = {};
      for (var i = 0; i < items.length; i++) {
        var raw = items[i];
        var book = safeText(raw.book || '');
        if (!Object.prototype.hasOwnProperty.call(groupedMap, book)) {
          groupedMap[book] = [];
          groupedOrder.push(book);
        }
        groupedMap[book].push(raw);
      }

      for (var g = 0; g < groupedOrder.length; g++) {
        var groupBook = groupedOrder[g];
        var arr = groupedMap[groupBook] || [];
        for (var j = 0; j < arr.length; j++) {
          var it = arr[j];
          var displayNumber = null;
          if (CONFIG.episodeNumberMode === 'backendGlobal') displayNumber = it.number;
          var numberPart = CONFIG.showEpisodeNumber && displayNumber != null ? ('#' + displayNumber + '. ') : '';
          var title = safeText(it.title || it.name || t('defaultTrackTitle'));
          var track = {};
          for (var k in it) {
            if (Object.prototype.hasOwnProperty.call(it, k)) track[k] = it[k];
          }
          track.book = safeText(it.book || '');
          track.name = safeText(it.name || '');
          track.displayTitle = numberPart + title;
          track.displayDate = formatDisplayDate(it.createdMs || 0);
          state.flat.push(track);
        }
      }
    }
    function render(preserveCurrent) {
      if (CONFIG.debug) {
        debugBox.style.display = 'block';
        if (window.__BOOT_LOGS && window.__BOOT_LOGS.length) debugOut.textContent = window.__BOOT_LOGS.join('\n');
      }

      player.hidden = !isExperimentalAudioMode();
      var items = Object.prototype.toString.call(ITEMS) === '[object Array]' ? ITEMS : [];
      buildFlatTracks(items);
      state.currentPage = clampPage(state.currentPage);
      renderPager();
      renderCurrentPage();

      if (state.flat.length) {
        setHero(state.flat[0]);
        if (preserveCurrent && state.currentIndex >= 0 && state.currentIndex < state.flat.length) {
          setCurrent(state.currentIndex, false);
        } else {
          setCurrent(0, CONFIG.autoplayFirstItem);
        }
        if (!isExperimentalAudioMode()) {
          setStatus(t('statusReady'));
          hint.textContent = t('openInDriveHint');
        }
      } else {
        hero.hidden = true;
        setStatus(t('statusNoFiles'));
        listEl.appendChild(makeEl('div', 'meta', t('noFilesInFolder')));
        now.textContent = t('noFilesInFolder');
      }
    }
    function wireEvents() {
      btnNext.addEventListener('click', function () { next(); });
      btnPrev.addEventListener('click', function () { prev(); });
      btnBack.addEventListener('click', function () {
        audio.currentTime = Math.max(0, (audio.currentTime || 0) - CONFIG.seekBackSeconds);
      });
      btnFwd.addEventListener('click', function () {
        audio.currentTime = (audio.currentTime || 0) + CONFIG.seekForwardSeconds;
      });
      refreshBtn.addEventListener('click', function () {
        window.location.reload();
      });
      heroOpenDrive.addEventListener('click', function () {
        if (state.flat.length) setCurrent(0, false);
      });
      audio.addEventListener('ended', function () {
        setStatus(t('statusEnded'));
        var track = state.flat[state.currentIndex];
        if (track) clearPosition(track);
        if (CONFIG.autoNextOnEnded && state.currentIndex + 1 < state.flat.length) next();
      });
      audio.addEventListener('timeupdate', function () {
        var track = state.flat[state.currentIndex];
        if (!track) return;
        if (audio.currentTime && Math.floor(audio.currentTime) % 3 === 0) savePosition(track, audio.currentTime);
      });
      audio.addEventListener('play', function () { setStatus(t('statusPlaying')); });
      audio.addEventListener('playing', function () { setStatus(t('statusPlaying')); });
      audio.addEventListener('pause', function () {
        if (!audio.ended) setStatus(t('statusPaused'));
      });
      audio.addEventListener('waiting', function () { setStatus(t('statusBuffering')); });
      audio.addEventListener('stalled', function () { setStatus(t('statusNetwork')); });
      audio.addEventListener('canplay', function () { setStatus(t('statusReady')); });
      langSelect.addEventListener('change', function () {
        setLanguage(langSelect.value, true);
      });
    }

    state.lang = loadPreferredLang();
    setLanguage(state.lang, false);
    wireEvents();
    render();
  </script>
</body>
</html>
