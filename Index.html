<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Сказки</title>

  <!--
    Index.html (hardened / maintainable)
    Goals:
    - Single "CONFIG" section for tuning
    - Defensive rendering (avoid innerHTML injection from filenames)
    - Optional debug panel/logging
    - Better playback UX: auto-next, resume position, seek buttons
    - Clear separation: data -> state -> UI
  -->

  <style>
    :root {
      --maxWidth: 860px;
      --radius: 12px;
      --border: #ddd;
      --borderSoft: #eee;
      --textSoft: #666;
      --bg: #fafafa;
      --card: #fff;
      --btnBorder: #ccc;
      --shadow: 0 1px 2px rgba(0,0,0,.04);
      --gap: 10px;
      --pad: 12px;
      --h1: 20px;
      --h2: 18px;
      --meta: 12px;
    }

    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 16px; background: var(--bg); }
    .wrap { max-width: var(--maxWidth); margin: 0 auto; }
    .topBar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 0 0 12px; }
    h1 { font-size: var(--h1); margin: 0; }
    .langWrap { display: flex; align-items: center; gap: 6px; }
    .langWrap label { font-size: 13px; color: var(--textSoft); }
    .langWrap select {
      border: 1px solid var(--btnBorder);
      border-radius: 8px;
      background: #fff;
      padding: 6px 8px;
      font-size: 14px;
    }
    .player { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--pad); background: var(--card); box-shadow: var(--shadow); }
    .now { font-weight: 700; margin-bottom: 8px; }
    audio { width: 100%; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button, a.btn {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--btnBorder);
      background: #fff;
      text-decoration: none;
      color: #000;
      cursor: pointer;
      user-select: none;
    }
    button[disabled] { opacity: 0.5; cursor: not-allowed; }
    .list { margin-top: 18px; }
    .book { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--borderSoft); }
    .book h2 { margin: 0 0 10px; font-size: var(--h2); }
    .item { border: 1px solid var(--borderSoft); border-radius: var(--radius); padding: 10px; margin: 8px 0; background: var(--card); box-shadow: var(--shadow); }
    .item.active { border-color: #999; }
    .meta { font-size: var(--meta); color: var(--textSoft); margin-top: 6px; }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .title { font-weight: 600; }
    .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
    .links a { font-size: 14px; }
    .pill { font-size: 12px; color: var(--textSoft); border: 1px solid var(--borderSoft); padding: 2px 8px; border-radius: 999px; }

    .debug {
      margin-top: 12px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 10px;
      background: #fff;
      display: none;
    }
    .debug pre { margin: 8px 0 0; font-size: 12px; white-space: pre-wrap; word-break: break-word; }

    .pager {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px;
      border: 1px solid var(--borderSoft);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .pager .pageInfo {
      font-size: 14px;
      color: var(--textSoft);
      margin: 0 10px;
    }
    .pager .pagerBtn {
      min-width: 46px;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: 600;
      border: 1px solid var(--btnBorder);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }
    .pager .pagerBtn.active {
      background: #e8eefc;
      border-color: #9fb3ea;
    }
    .pager .pagerBtn[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="topBar">
    <h1 id="pageTitle">Сказки</h1>
    <div class="langWrap">
      <label for="langSelect" id="langLabel">Язык</label>
      <select id="langSelect">
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>
    </div>
  </div>

  <div class="player">
    <div class="now" id="now">Ничего не выбрано</div>

    <audio id="audio" controls preload="metadata" playsinline></audio>

    <div class="controls">
      <button id="prev" title="Предыдущая сказка">◀ Предыдущая</button>
      <button id="next" title="Следующая сказка">Следующая ▶</button>

      <button id="back10" title="-10 секунд">↺ -10с</button>
      <button id="fwd30" title="+30 секунд">↻ +30с</button>

      <a class="btn" id="openDrive" href="#" target="_blank" rel="noopener">Открыть в Drive</a>
      <span class="pill" id="status">готово</span>
    </div>

    <div class="meta" id="hint"></div>
    <div class="meta" id="buildInfo">build: <?= buildId ?></div>

    <div class="debug" id="debugBox">
      <div class="meta"><b id="debugTitle">Debug</b> <span id="debugHint">(toggle in CONFIG)</span></div>
      <pre id="debugOut"></pre>
    </div>
  </div>

  <div class="pager" id="pagerTop"></div>
  <div class="list" id="list"></div>
  <div class="pager" id="pagerBottom"></div>
</div>

<script id="itemsData" type="application/json"><?!= itemsJson ?></script>
<script>
  (function () {
    var logs = [];
    function push(msg) {
      try {
        var line = '[boot] ' + msg;
        logs.push(line);
        if (window.console && console.log) console.log(line);
      } catch (e) { /* ignore */ }
    }
    window.__BOOT_LOGS = logs;
    window.__bootLog = push;

    window.addEventListener('error', function (ev) {
      var msg = ev && ev.message ? ev.message : 'unknown error';
      var src = ev && ev.filename ? ev.filename : 'no-file';
      var ln = ev && ev.lineno ? ev.lineno : 0;
      push('window.error: ' + msg + ' @ ' + src + ':' + ln);
    });

    window.addEventListener('unhandledrejection', function (ev) {
      var reason = ev && ev.reason ? String(ev.reason) : 'unknown rejection';
      push('unhandledrejection: ' + reason);
    });

    push('bootstrap loaded; build=<?= buildId ?>');
  })();
</script>

<script>
  var I18N = {
    ru: {
      appTitle: 'Казки Максиму від папи',
      langLabel: 'Язык',
      nowNothingSelected: 'Ничего не выбрано',
      buttonPrev: '◀ Предыдущая',
      buttonNext: 'Следующая ▶',
      buttonPrevTitle: 'Предыдущая сказка',
      buttonNextTitle: 'Следующая сказка',
      buttonBack: '↺ -10с',
      buttonFwd: '↻ +30с',
      buttonBackTitle: '-10 секунд',
      buttonFwdTitle: '+30 секунд',
      openInDriveLabel: 'Открыть в Google Drive',
      playInBrowserLabel: '▶ Воспроизвести в браузере',
      downloadInListLabel: '⬇ Скачать',
      statusReady: 'готово',
      statusLoading: 'загрузка...',
      statusPlaying: 'играет',
      statusPressPlay: 'нажми Play',
      statusError: 'ошибка',
      statusNoFiles: 'нет файлов',
      statusEnded: 'конец',
      statusPaused: 'пауза',
      statusBuffering: 'буфер...',
      statusNetwork: 'сеть...',
      uploadedAt: 'Загружено: {date}',
      sourceProgress: 'Источник {current}/{total}',
      sourceProgressWithDate: 'Источник {current}/{total} • Загружено: {date}',
      tryingAnotherUrl: 'пробуем другой URL...',
      noPlaybackUrl: 'Нет URL для воспроизведения.',
      notPlayableOpenDrive: 'Не проигрывается в браузере. Нажмите "{label}". ({err})',
      notPlayable: 'Не проигрывается в браузере. ({err})',
      openInDriveRecommended: ' (рекомендуется)',
      noFilesInFolder: 'Нет файлов в папке',
      defaultTrackTitle: 'Сказка',
      debugTitle: 'Debug',
      debugHint: '(toggle in CONFIG)',
      pagerFirst: '«',
      pagerPrev: '‹',
      pagerNext: '›',
      pagerLast: '»',
      pagerInfo: 'Страница {current} из {total}'
    },
    en: {
      appTitle: 'Stories',
      langLabel: 'Language',
      nowNothingSelected: 'Nothing selected',
      buttonPrev: '◀ Previous',
      buttonNext: 'Next ▶',
      buttonPrevTitle: 'Previous story',
      buttonNextTitle: 'Next story',
      buttonBack: '↺ -10s',
      buttonFwd: '↻ +30s',
      buttonBackTitle: '-10 seconds',
      buttonFwdTitle: '+30 seconds',
      openInDriveLabel: 'Open in Google Drive',
      playInBrowserLabel: '▶ Play in browser',
      downloadInListLabel: '⬇ Download',
      statusReady: 'ready',
      statusLoading: 'loading...',
      statusPlaying: 'playing',
      statusPressPlay: 'press Play',
      statusError: 'error',
      statusNoFiles: 'no files',
      statusEnded: 'ended',
      statusPaused: 'paused',
      statusBuffering: 'buffering...',
      statusNetwork: 'network...',
      uploadedAt: 'Uploaded: {date}',
      sourceProgress: 'Source {current}/{total}',
      sourceProgressWithDate: 'Source {current}/{total} • Uploaded: {date}',
      tryingAnotherUrl: 'trying another URL...',
      noPlaybackUrl: 'No playback URL available.',
      notPlayableOpenDrive: 'Cannot play in browser. Tap "{label}". ({err})',
      notPlayable: 'Cannot play in browser. ({err})',
      openInDriveRecommended: ' (recommended)',
      noFilesInFolder: 'No files in folder',
      defaultTrackTitle: 'Story',
      debugTitle: 'Debug',
      debugHint: '(toggle in CONFIG)',
      pagerFirst: '«',
      pagerPrev: '‹',
      pagerNext: '›',
      pagerLast: '»',
      pagerInfo: 'Page {current} of {total}'
    }
  };

  var CONFIG = {
    defaultLanguage: 'ru',
    rememberLanguage: true,
    itemsPerPage: 10,
    autoplayOnSelect: true,
    autoplayFirstItem: false,
    autoNextOnEnded: true,
    rememberPosition: true,
    rememberPositionMinSeconds: 8,
    seekBackSeconds: 10,
    seekForwardSeconds: 30,
    groupByBook: true,
    showCreatedAt: true,
    showDriveLinkInList: true,
    showDownloadLinkInList: false,
    showEpisodeNumber: true,
    episodeNumberMode: 'backendGlobal',
    fallbackToDriveViewOnError: true,
    debug: false,
    logToConsole: false
  };

  function isDebugEnabled() {
    var q = String(window.location.search || '');
    return q.indexOf('debug=1') >= 0;
  }
  if (isDebugEnabled()) {
    CONFIG.debug = true;
    CONFIG.logToConsole = true;
  }

  function parseItemsFromDom() {
    if (window.__bootLog) window.__bootLog('parseItemsFromDom:start');
    try {
      var node = document.getElementById('itemsData');
      var raw = node ? node.textContent : '[]';
      if (window.__bootLog) window.__bootLog('itemsData chars=' + (raw ? raw.length : 0));
      var parsed = JSON.parse(raw || '[]');
      if (window.__bootLog) window.__bootLog('parseItemsFromDom:ok items=' + (parsed && parsed.length ? parsed.length : 0));
      return Object.prototype.toString.call(parsed) === '[object Array]' ? parsed : [];
    } catch (e) {
      console.error('Failed to parse itemsJson', e);
      if (window.__bootLog) window.__bootLog('parseItemsFromDom:error ' + (e && e.message ? e.message : String(e)));
      return [];
    }
  }

  var ITEMS = parseItemsFromDom();
  var state = { flat: [], currentIndex: -1, currentPage: 1, isUserGesture: false, candidateUrls: [], candidateIndex: 0, unsupportedById: {}, lang: 'ru' };

  function $(id) { return document.getElementById(id); }
  var audio = $('audio');
  var now = $('now');
  var hint = $('hint');
  var listEl = $('list');
  var pagerTop = $('pagerTop');
  var pagerBottom = $('pagerBottom');
  var statusEl = $('status');
  var btnPrev = $('prev');
  var btnNext = $('next');
  var btnBack = $('back10');
  var btnFwd = $('fwd30');
  var openDrive = $('openDrive');
  var langLabelEl = $('langLabel');
  var langSelect = $('langSelect');
  var debugBox = $('debugBox');
  var debugOut = $('debugOut');
  var debugTitle = $('debugTitle');
  var debugHint = $('debugHint');

  function log() {
    var args = Array.prototype.slice.call(arguments);
    if (CONFIG.logToConsole && console && console.log) console.log.apply(console, ['[stories]'].concat(args));
    if (window.__BOOT_LOGS) {
      try {
        var compact = [];
        for (var i = 0; i < args.length; i++) compact.push(typeof args[i] === 'string' ? args[i] : JSON.stringify(args[i]));
        window.__BOOT_LOGS.push('[stories] ' + compact.join(' '));
      } catch (e) {}
    }
    if (CONFIG.debug) {
      var msg = [];
      for (var j = 0; j < args.length; j++) msg.push(typeof args[j] === 'string' ? args[j] : JSON.stringify(args[j], null, 2));
      debugOut.textContent = (debugOut.textContent + '\n' + msg.join(' ')).trim();
    }
  }

  function setStatus(text) { statusEl.textContent = text; }
  function t(key, vars) {
    var langPack = I18N[state.lang] || I18N[CONFIG.defaultLanguage] || I18N.ru;
    var fallback = I18N.ru || {};
    var raw = Object.prototype.hasOwnProperty.call(langPack, key) ? langPack[key] : fallback[key];
    var text = (raw == null) ? key : String(raw);
    if (!vars) return text;
    return text.replace(/\{([a-zA-Z0-9_]+)\}/g, function (_, name) {
      return Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : '';
    });
  }
  function normalizeLang(lang) {
    if (!lang) return CONFIG.defaultLanguage;
    return Object.prototype.hasOwnProperty.call(I18N, lang) ? lang : CONFIG.defaultLanguage;
  }
  function loadPreferredLang() {
    if (!CONFIG.rememberLanguage) return CONFIG.defaultLanguage;
    try {
      return normalizeLang(localStorage.getItem('uiLang:v1'));
    } catch (e) {
      return CONFIG.defaultLanguage;
    }
  }
  function savePreferredLang(lang) {
    if (!CONFIG.rememberLanguage) return;
    try {
      localStorage.setItem('uiLang:v1', lang);
    } catch (e) {}
  }
  function applyStaticLabels() {
    document.documentElement.lang = state.lang;
    document.title = t('appTitle');
    $('pageTitle').textContent = t('appTitle');
    langLabelEl.textContent = t('langLabel');
    now.textContent = t('nowNothingSelected');
    btnPrev.textContent = t('buttonPrev');
    btnPrev.title = t('buttonPrevTitle');
    btnNext.textContent = t('buttonNext');
    btnNext.title = t('buttonNextTitle');
    btnBack.textContent = t('buttonBack');
    btnBack.title = t('buttonBackTitle');
    btnFwd.textContent = t('buttonFwd');
    btnFwd.title = t('buttonFwdTitle');
    openDrive.textContent = t('openInDriveLabel');
    debugTitle.textContent = t('debugTitle');
    debugHint.textContent = t('debugHint');
  }
  function setLanguage(lang, rerender) {
    state.lang = normalizeLang(lang);
    langSelect.value = state.lang;
    savePreferredLang(state.lang);
    applyStaticLabels();
    if (rerender) render(true);
  }
  function getExt(name) {
    var s = safeText(name).toLowerCase();
    var m = s.match(/\.([a-z0-9]+)$/);
    return m ? m[1] : '';
  }
  function guessMimeByExt(ext) {
    if (ext === 'mp3') return 'audio/mpeg';
    if (ext === 'ogg') return 'audio/ogg';
    if (ext === 'm4a') return 'audio/mp4';
    return '';
  }
  function loadUnsupportedMap() {
    try {
      var raw = localStorage.getItem('unsupportedById:v1');
      var obj = raw ? JSON.parse(raw) : {};
      return obj && typeof obj === 'object' ? obj : {};
    } catch (e) {
      return {};
    }
  }
  function saveUnsupportedMap() {
    try {
      localStorage.setItem('unsupportedById:v1', JSON.stringify(state.unsupportedById || {}));
    } catch (e) {}
  }
  function isKnownUnsupported(track) {
    return !!(track && track.id && state.unsupportedById && state.unsupportedById[track.id]);
  }
  function markUnsupported(track, errCode) {
    if (!track || !track.id) return;
    state.unsupportedById[track.id] = { err: errCode || 'code=4', at: Date.now() };
    saveUnsupportedMap();
    log('marked unsupported', { id: track.id, err: errCode || 'code=4' });
  }
  function canLikelyPlayInBrowser(track) {
    var ext = getExt(track && (track.name || track.title || ''));
    var mime = guessMimeByExt(ext);
    if (!mime) return false;
    if (!audio || typeof audio.canPlayType !== 'function') return true;
    var answer = String(audio.canPlayType(mime) || '').toLowerCase();
    return answer === 'probably' || answer === 'maybe';
  }
  function clearPlayWatchdog() {
    if (state.playWatchdogId) {
      clearTimeout(state.playWatchdogId);
      state.playWatchdogId = 0;
    }
  }
  function armPlayWatchdog(autoplay) {
    clearPlayWatchdog();
    if (!autoplay) return;
    state.playWatchdogId = setTimeout(function () {
      // If playback did not really start, try alternate URL.
      if (audio.paused && (!audio.currentTime || audio.currentTime < 0.25)) {
        log('play watchdog: no progress, trying fallback');
        tryNextCandidate(true);
      }
    }, 1800);
  }
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function safeText(s) { return (s == null) ? '' : String(s); }
  function getPageSize() {
    var n = Number(CONFIG.itemsPerPage);
    if (!isFinite(n) || n < 1) return 10;
    return Math.floor(n);
  }
  function getTotalPages() {
    var pageSize = getPageSize();
    return Math.max(1, Math.ceil(state.flat.length / pageSize));
  }
  function pageForIndex(index) {
    return Math.floor(index / getPageSize()) + 1;
  }
  function clampPage(page) {
    return clamp(page, 1, getTotalPages());
  }
  function getPageWindow(total, current, visibleCount) {
    var count = Math.max(1, visibleCount || 5);
    var start = Math.max(1, current - Math.floor(count / 2));
    var end = Math.min(total, start + count - 1);
    start = Math.max(1, end - count + 1);
    return { start: start, end: end };
  }

  function buildPlaybackCandidates(track) {
    var out = [];
    if (track && track.url) out.push(track.url);
    if (track && track.id) {
      out.push('https://drive.google.com/uc?export=download&id=' + track.id);
      out.push('https://drive.google.com/uc?export=open&id=' + track.id);
    }
    var uniq = [];
    var seen = {};
    for (var i = 0; i < out.length; i++) {
      var u = out[i];
      if (!u || seen[u]) continue;
      seen[u] = true;
      uniq.push(u);
    }
    return uniq;
  }

  function storageKeyForTrack(track) {
    return track && (track.id ? 'pos:' + track.id : 'pos:' + track.url);
  }
  function loadSavedPosition(track) {
    if (!CONFIG.rememberPosition) return 0;
    try {
      var key = storageKeyForTrack(track);
      var raw = localStorage.getItem(key);
      var val = raw ? Number(raw) : 0;
      return isFinite(val) ? val : 0;
    } catch (e) { return 0; }
  }
  function savePosition(track, seconds) {
    if (!CONFIG.rememberPosition) return;
    if (!isFinite(seconds)) return;
    if (seconds < CONFIG.rememberPositionMinSeconds) return;
    try {
      var key = storageKeyForTrack(track);
      localStorage.setItem(key, String(seconds));
    } catch (e) {}
  }
  function clearPosition(track) {
    if (!CONFIG.rememberPosition) return;
    try {
      var key = storageKeyForTrack(track);
      localStorage.removeItem(key);
    } catch (e) {}
  }

  function updateNavButtons() {
    btnPrev.disabled = !(state.currentIndex > 0);
    btnNext.disabled = !(state.currentIndex >= 0 && state.currentIndex + 1 < state.flat.length);
  }

  function highlightActive() {
    var nodes = document.querySelectorAll('.item');
    for (var i = 0; i < nodes.length; i++) nodes[i].classList.remove('active');
    var el = document.querySelector('.item[data-idx="' + state.currentIndex + '"]');
    if (el) el.classList.add('active');
  }

  function tryPlay() {
    try {
      log('tryPlay', { idx: state.currentIndex, src: audio.currentSrc || audio.src });
      var p = audio.play();
      if (p && typeof p.then === 'function') {
        p.then(function () {
          setStatus(t('statusPlaying'));
          log('play promise resolved');
        }).catch(function (e) {
          setStatus(t('statusPressPlay'));
          log('play() blocked or failed:', e && e.message ? e.message : e);
        });
      } else {
        setStatus(t('statusPlaying'));
        log('play immediate');
      }
    } catch (e) {
      setStatus(t('statusPressPlay'));
      log('play() failed:', e && e.message ? e.message : e);
    }
  }

  function setAudioSource(url) {
    audio.pause();
    audio.removeAttribute('src');
    audio.innerHTML = '';
    audio.src = url;
    audio.load();
  }
  function currentCandidateUrl() {
    return state.candidateUrls[state.candidateIndex] || '';
  }
  function tryNextCandidate(autoplay) {
    if (state.candidateIndex + 1 >= state.candidateUrls.length) return false;
    state.candidateIndex += 1;
    setStatus(t('tryingAnotherUrl'));
    hint.textContent = t('sourceProgress', { current: state.candidateIndex + 1, total: state.candidateUrls.length });
    log('fallback source', { index: state.candidateIndex, url: currentCandidateUrl() });
    setAudioSource(currentCandidateUrl());
    armPlayWatchdog(autoplay);
    if (autoplay) {
      var onCanPlay = function () {
        audio.removeEventListener('canplay', onCanPlay);
        tryPlay();
      };
      audio.addEventListener('canplay', onCanPlay);
    }
    return true;
  }

  function setCurrent(index, autoplay) {
    if (typeof autoplay === 'undefined') autoplay = CONFIG.autoplayOnSelect;
    if (index < 0 || index >= state.flat.length) return;
    var targetPage = pageForIndex(index);
    if (targetPage !== state.currentPage) {
      state.currentPage = targetPage;
      renderPager();
      renderCurrentPage();
    }

    state.currentIndex = index;
    var track = state.flat[index];
    now.textContent = track.displayTitle;
    hint.textContent = (CONFIG.showCreatedAt && track.createdStr) ? t('uploadedAt', { date: track.createdStr }) : '';
    openDrive.href = track.viewUrl || '#';
    openDrive.textContent = t('openInDriveLabel');

    setStatus(t('statusLoading'));
    state.candidateUrls = buildPlaybackCandidates(track);
    state.candidateIndex = 0;
    log('setCurrent', { index: index, title: track.displayTitle, candidates: state.candidateUrls });
    if (!state.candidateUrls.length) {
      setStatus(t('statusError'));
      hint.textContent = t('noPlaybackUrl');
      highlightActive();
      updateNavButtons();
      return;
    }
    hint.textContent = (CONFIG.showCreatedAt && track.createdStr)
      ? t('sourceProgressWithDate', { current: 1, total: state.candidateUrls.length, date: track.createdStr })
      : t('sourceProgress', { current: 1, total: state.candidateUrls.length });
    setAudioSource(currentCandidateUrl());
    armPlayWatchdog(autoplay);

    var saved = loadSavedPosition(track);
    audio.onloadedmetadata = function () {
      log('loadedmetadata', { duration: audio.duration, url: currentCandidateUrl() });
      if (saved > 0 && isFinite(audio.duration)) {
        audio.currentTime = clamp(saved, 0, Math.max(0, audio.duration - 0.5));
      }
      if (autoplay) tryPlay();
      highlightActive();
      updateNavButtons();
    };

    audio.onerror = function () {
      var err = audio.error ? ('code=' + audio.error.code) : 'unknown';
      log('audio error', { err: err, url: currentCandidateUrl() });
      if (tryNextCandidate(autoplay)) return;
      setStatus(t('statusError'));
      if (err === 'code=4') {
        markUnsupported(track, err);
      }
      if (CONFIG.fallbackToDriveViewOnError && track.viewUrl) {
        hint.textContent = t('notPlayableOpenDrive', { label: t('openInDriveLabel'), err: err });
        openDrive.textContent = t('openInDriveLabel') + t('openInDriveRecommended');
      } else {
        hint.textContent = t('notPlayable', { err: err });
      }
    };

    highlightActive();
    updateNavButtons();
  }

  function next() {
    if (state.currentIndex + 1 < state.flat.length) setCurrent(state.currentIndex + 1, true);
  }
  function prev() {
    if (state.currentIndex - 1 >= 0) setCurrent(state.currentIndex - 1, true);
  }

  function groupItemsByBook(items) {
    var out = { order: [], map: {} };
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var book = safeText(it.book || t('appTitle'));
      if (!out.map[book]) {
        out.map[book] = [];
        out.order.push(book);
      }
      out.map[book].push(it);
    }
    return out;
  }

  function makeEl(tag, className, text) {
    var el = document.createElement(tag);
    if (className) el.className = className;
    if (text != null) el.textContent = text;
    return el;
  }

  function makeLink(text, href, opts) {
    opts = opts || {};
    var a = document.createElement('a');
    a.href = href || '#';
    a.textContent = text;
    if (opts.download) a.setAttribute('download', '');
    if (opts.newTab) {
      a.target = '_blank';
      a.rel = 'noopener';
    }
    if (opts.preventDefault) {
      a.href = '#';
      a.addEventListener('click', function (e) {
        e.preventDefault();
        if (opts.onClick) opts.onClick(e);
      });
    } else if (opts.onClick) {
      a.addEventListener('click', opts.onClick);
    }
    return a;
  }

  function renderPagerInto(container, totalPages, currentPage) {
    container.innerHTML = '';
    var frag = document.createDocumentFragment();

    function addButton(label, targetPage, disabled, active) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pagerBtn' + (active ? ' active' : '');
      btn.textContent = label;
      btn.disabled = !!disabled;
      if (!disabled) {
        btn.addEventListener('click', function () {
          state.currentPage = clampPage(targetPage);
          renderPager();
          renderCurrentPage();
        });
      }
      frag.appendChild(btn);
    }

    addButton(t('pagerFirst'), 1, currentPage <= 1, false);
    addButton(t('pagerPrev'), currentPage - 1, currentPage <= 1, false);

    var windowPages = getPageWindow(totalPages, currentPage, 5);
    for (var p = windowPages.start; p <= windowPages.end; p++) {
      addButton(String(p), p, false, p === currentPage);
    }

    addButton(t('pagerNext'), currentPage + 1, currentPage >= totalPages, false);
    addButton(t('pagerLast'), totalPages, currentPage >= totalPages, false);

    var info = makeEl('span', 'pageInfo', t('pagerInfo', { current: currentPage, total: totalPages }));
    frag.appendChild(info);
    container.appendChild(frag);
  }

  function renderPager() {
    var totalPages = getTotalPages();
    state.currentPage = clampPage(state.currentPage);
    renderPagerInto(pagerTop, totalPages, state.currentPage);
    renderPagerInto(pagerBottom, totalPages, state.currentPage);
  }

  function renderCurrentPage() {
    listEl.innerHTML = '';
    var pageSize = getPageSize();
    var startIdx = (state.currentPage - 1) * pageSize;
    var endIdx = Math.min(state.flat.length, startIdx + pageSize);
    var containerFrag = document.createDocumentFragment();

    var block = null;
    var currentBook = '';
    for (var idx = startIdx; idx < endIdx; idx++) {
      var track = state.flat[idx];
      var book = safeText(track.book || t('appTitle'));
      if (CONFIG.groupByBook) {
        if (!block || book !== currentBook) {
          block = makeEl('div', 'book');
          block.appendChild(makeEl('h2', null, book));
          containerFrag.appendChild(block);
          currentBook = book;
        }
      } else if (!block) {
        block = makeEl('div', 'book');
        containerFrag.appendChild(block);
      }

      var itemEl = makeEl('div', 'item');
      itemEl.setAttribute('data-idx', String(idx));

      var row = makeEl('div', 'row');
      row.appendChild(makeEl('div', 'title', track.displayTitle));
      row.appendChild(makeEl('div', 'meta', CONFIG.showCreatedAt ? safeText(track.createdStr || '') : ''));
      itemEl.appendChild(row);

      var links = makeEl('div', 'links');
      (function (capturedIdx, capturedTrack) {
        if (capturedTrack.viewUrl) {
          links.appendChild(makeLink(t('openInDriveLabel'), capturedTrack.viewUrl, { newTab: true }));
        }
        if (capturedTrack.showPlayInBrowser) {
          links.appendChild(makeLink(t('playInBrowserLabel'), '#', {
            preventDefault: true,
            onClick: function () { setCurrent(capturedIdx, true); }
          }));
        }
        itemEl.addEventListener('click', function (e) {
          var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
          if (tag === 'a') return;
          setCurrent(capturedIdx, !!capturedTrack.showPlayInBrowser);
        });
      })(idx, track);

      if (CONFIG.showDownloadLinkInList && track.url) links.appendChild(makeLink(t('downloadInListLabel'), track.url, { download: true }));
      itemEl.appendChild(links);
      block.appendChild(itemEl);
    }

    listEl.appendChild(containerFrag);
    highlightActive();
  }

  function buildFlatTracks(items) {
    state.flat = [];
    var grouped;
    if (CONFIG.groupByBook) {
      grouped = groupItemsByBook(items);
    } else {
      grouped = { order: [t('appTitle')], map: {} };
      grouped.map[t('appTitle')] = items;
    }

    for (var b = 0; b < grouped.order.length; b++) {
      var book = grouped.order[b];
      var arr = grouped.map[book] || [];
      for (var localIdx = 0; localIdx < arr.length; localIdx++) {
        var it = arr[localIdx];
        var perBookNumber = arr.length - localIdx;
        var displayNumber = null;
        if (CONFIG.episodeNumberMode === 'backendGlobal') displayNumber = it.number;
        else if (CONFIG.episodeNumberMode === 'perBook') displayNumber = perBookNumber;
        var numberPart = (CONFIG.showEpisodeNumber && displayNumber != null) ? ('#' + displayNumber + '. ') : '';
        var title = safeText(it.title || it.name || t('defaultTrackTitle'));

        var track = {};
        for (var k in it) if (Object.prototype.hasOwnProperty.call(it, k)) track[k] = it[k];
        track.book = safeText(book);
        track.displayTitle = numberPart + title;
        track.name = it.name || it.title || '';
        track.url = it.url;
        track.viewUrl = it.viewUrl;
        track.showPlayInBrowser = canLikelyPlayInBrowser(track);
        state.flat.push(track);
      }
    }
  }

  function render(preserveCurrent) {
    if (window.__bootLog) window.__bootLog('render:start');
    $('pageTitle').textContent = t('appTitle');
    if (CONFIG.debug) {
      debugBox.style.display = 'block';
      if (window.__BOOT_LOGS && window.__BOOT_LOGS.length) debugOut.textContent = window.__BOOT_LOGS.join('\n');
    }

    var items = Object.prototype.toString.call(ITEMS) === '[object Array]' ? ITEMS : [];
    if (window.__bootLog) window.__bootLog('render:items=' + items.length);
    state.unsupportedById = loadUnsupportedMap();
    buildFlatTracks(items);
    state.currentPage = clampPage(state.currentPage);
    renderPager();
    renderCurrentPage();

    if (state.flat.length) {
      if (preserveCurrent && state.currentIndex >= 0 && state.currentIndex < state.flat.length) {
        setCurrent(state.currentIndex, false);
      } else {
        setCurrent(0, CONFIG.autoplayFirstItem);
      }
      setStatus(t('statusReady'));
    } else {
      setStatus(t('statusNoFiles'));
      now.textContent = t('noFilesInFolder');
    }
  }

  function wireEvents() {
    if (window.__bootLog) window.__bootLog('wireEvents:start');
    var markGesture = function () {
      state.isUserGesture = true;
      window.removeEventListener('click', markGesture);
      window.removeEventListener('touchstart', markGesture);
      window.removeEventListener('keydown', markGesture);
    };
    window.addEventListener('click', markGesture);
    window.addEventListener('touchstart', markGesture);
    window.addEventListener('keydown', markGesture);

    btnNext.addEventListener('click', function () { next(); });
    btnPrev.addEventListener('click', function () { prev(); });
    btnBack.addEventListener('click', function () { audio.currentTime = Math.max(0, (audio.currentTime || 0) - CONFIG.seekBackSeconds); });
    btnFwd.addEventListener('click', function () { audio.currentTime = (audio.currentTime || 0) + CONFIG.seekForwardSeconds; });

    audio.addEventListener('ended', function () {
      log('ended', { currentTime: audio.currentTime, duration: audio.duration });
      setStatus(t('statusEnded'));
      var t = state.flat[state.currentIndex];
      if (t) clearPosition(t);
      if (CONFIG.autoNextOnEnded && state.currentIndex + 1 < state.flat.length) next();
    });
    audio.addEventListener('timeupdate', function () {
      var t = state.flat[state.currentIndex];
      if (!t) return;
      if (audio.currentTime && Math.floor(audio.currentTime) % 3 === 0) savePosition(t, audio.currentTime);
    });
    audio.addEventListener('play', function () { setStatus(t('statusPlaying')); });
    audio.addEventListener('playing', function () {
      clearPlayWatchdog();
      log('playing', { currentTime: audio.currentTime, url: audio.currentSrc || audio.src });
      setStatus(t('statusPlaying'));
    });
    audio.addEventListener('pause', function () {
      log('pause', { currentTime: audio.currentTime, ended: audio.ended });
      setStatus(t('statusPaused'));
    });
    audio.addEventListener('waiting', function () {
      log('waiting');
      setStatus(t('statusBuffering'));
    });
    audio.addEventListener('stalled', function () {
      log('stalled');
      setStatus(t('statusNetwork'));
    });
    audio.addEventListener('canplay', function () {
      log('canplay');
      setStatus(t('statusReady'));
    });
    langSelect.addEventListener('change', function () {
      setLanguage(langSelect.value, true);
    });
  }

  if (window.__bootLog) window.__bootLog('init:start');
  state.lang = loadPreferredLang();
  setLanguage(state.lang, false);
  wireEvents();
  if (window.__bootLog) window.__bootLog('init:events-wired');
  render();
  if (window.__bootLog) window.__bootLog('init:render-done');
</script>
</body>
</html>
